# This file is used to package this project as a pip package.

[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "khiops-driver-azure"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause-Clear"
license-files = ["LICENSE"]
maintainers = [{name = "Khiops Team", email = "khiops.team@orange.com"}]
dynamic = ["version", "description"]

[tool.scikit-build]
sdist.include = [
    "/vcpkg/"
]
sdist.exclude = [
    "/.*",  # .github, .gitignore, .gitmodules, .pre-commit-config.yaml...
    "/scripts/"
]
ninja.make-fallback = false
cmake.args = ["--preset", "ninja-multi-vcpkg-release", "--toolchain", "vcpkg/scripts/buildsystems/vcpkg.cmake"]
build.targets = ["khiopsdriver_file_azure"]
wheel.py-api = "py3"  # Our package is compatible with any version of Python since we do not use Python!

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/azureplugin.hpp"
regex = '#define DRIVER_VERSION KHIOPS_STR\((?P<value>[^)]*)\)'

[tool.scikit-build.metadata.description]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'set\(CPACK_PACKAGE_DESCRIPTION "(?P<value>.*)"\)'

[tool.cibuildwheel]
build = "cp39-*"
skip = "*musllinux*"  # Khiops itself does not compile under musl linuxes, so there is no need for musl linux Khiops drivers

[tool.cibuildwheel.linux]
before-all = [
    "DEB_NEEDS='zip perl ninja-build'",
    "FED_NEEDS='zip perl ninja-build'",
    "apt-get install -y $DEB_NEEDS || dnf install -y $FED_NEEDS"
]
