---
name: Test conda-forge Packages
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash -el {0}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        env:
          - {os: ubuntu-latest, os-family: linux-x64}
          - {os: ubuntu-22.04, os-family: linux-x64}
          - {os: macos-latest, os-family: osx-arm64}
          - {os: macos-15-intel, os-family: osx-64}
          - {os: macos-14, os-family: osx-arm64}
          - {os: windows-latest, os-family: win-64}
          - {os: windows-2022, os-family: win-64}
    runs-on: ${{ matrix.env.os }}
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest  # needed for macOS 13
          python-version: '3.12'
          channels: conda-forge
          conda-remove-defaults: true
          
      - name: Install the khiops-core and driver Conda packages
        run: conda install -c conda-forge khiops-core==11.0.0 khiops-driver-azure

      - name: Add CONDA binary dir to PATH
        run: |
          if [[ $RUNNER_OS == "Windows" ]]
          then
            echo $CONDA/envs/test/Library/bin >> "$GITHUB_PATH"
          else
            echo "$CONDA_PREFIX/bin" >> "$GITHUB_PATH"
          fi

      - name: Checkout sources
        uses: actions/checkout@v7

      # Retrieve azure credentials through WIF - needed to run tests
      # - name: Azure CLI Login
      #   if:  github.ref_type != 'tag'
      #   uses: azure/login@v2.3.0
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # - if: github.ref_type == 'tag'
      #   run: echo "AZURE_STORAGE_CONNECTION_STRING='${{ secrets.AZURE_CONNECTION_STRING }}'" >> $GITHUB_ENV
      - run: echo "AZURE_STORAGE_CONNECTION_STRING='${{ secrets.AZURE_CONNECTION_STRING }}'" >> $GITHUB_ENV
    
      - name: Test that the executables are installed
        uses: ./.github/actions/test-khiops-install

      - name: Test that khiops works on Iris dataset
        uses: ./.github/actions/test-khiops-on-iris
        with:
          os-decription: ${{ matrix.env.os }}-${{ matrix.env.os-family }}    
