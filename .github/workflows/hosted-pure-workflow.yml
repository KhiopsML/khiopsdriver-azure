# A "pure" GitHub workflow using CMake, Ninja and vcpkg to build a C/C++ codebase.
# It leverages both CMakePresets.json and vcpkg.json.
# It is called "pure workflow" because it is an example which minimizes the usage of
# custom GitHub Actions, but leverages directly the tools that could be easily run on
# your development machines (i.e. CMake, vcpkg, Ninja) to ensure a perfectly identical
# and reproducible local build (on your development machine) and a remote build on
# build agents.
name: hosted-pure-workflow
on:
  workflow_dispatch:
  # push:
  # pull_request:
  #   branches: 
  #   - v11
  #   - main

jobs:
  job:
    name: ${{ matrix.os }}-${{ github.workflow }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, triplet: x64-linux}
          - {os: macos-latest, triplet: arm64-osx}
          - {os: macos-15-intel, triplet: x64-osx}
          - {os: macos-14, triplet: arm64-osx}
          - {os: windows-latest, triplet: x64-windows}
    defaults:
      run:
        shell: bash
    permissions:
      contents: 'read'
      id-token: 'write'         
    env:
      # Indicates the location of the vcpkg as a Git submodule of the project repository.
      # Not using "VCPKG_ROOT" because a variable with the same name is defined in the VS's
      # Developer Command Prompt environment in VS 2022 17.6, which would override this one 
      # if it had the same name.
      _VCPKG_: ${{ github.workspace }}/vcpkg
      # Tells vcpkg where binary packages are stored.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg/bincache
      # Let's use GitHub Action cache as storage for the vcpkg Binary Caching feature.
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
      # Allow setting triplet to something else than platform's default
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}

    steps:
      # Set env vars needed for vcpkg to leverage the GitHub Action cache as a storage
      # for Binary Caching.
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: ./.github/actions/fix-win-azure-config
          
      - name: "Create directory '${{ env.VCPKG_DEFAULT_BINARY_CACHE }}'"
        run: mkdir -p $VCPKG_DEFAULT_BINARY_CACHE

      - name: Install Azurite
        id: azuright
        uses: sgouache/azuright@v1.2
        with:
          skip-api-version-check: true

      - name: Set STORAGE_DRIVER_TEST_URL_PREFIX values
        run: |
          EMULATED_BLOB_ENDPOINT=$(echo '${{ steps.azuright.outputs.connstring }}' | tr ';' '\n' | grep -E '^BlobEndpoint=' | cut -d'=' -f2)
          echo "STORAGE_DRIVER_TEST_URL_PREFIX_EMULATED_BLOB=$EMULATED_BLOB_ENDPOINT/data-test-khiops-driver-azure" >> $GITHUB_ENV
          echo "STORAGE_DRIVER_TEST_URL_PREFIX_CLOUD_BLOB=https://khiopsdriverazure.blob.core.windows.net/data-test-khiops-driver-azure" >> $GITHUB_ENV
          echo "STORAGE_DRIVER_TEST_URL_PREFIX_CLOUD_FILE=https://khiopsdriverazure.file.core.windows.net/data-test-khiops-driver-azure" >> $GITHUB_ENV

      # Populate storage emulator
      - name:  Install test data in Azurite
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          elif [ "$RUNNER_OS" == "Windows" ]; then
            pwsh scripts\\install_azurecli.ps1
          else
            brew update && brew install azure-cli
          fi
          export AZURE_STORAGE_CONNECTION_STRING='${{ steps.azuright.outputs.connstring }}'
          az storage container create -n data-test-khiops-driver-azure --connection-string "${{ steps.azuright.outputs.connstring }}"
          az storage blob upload-batch --destination data-test-khiops-driver-azure/khiops_data --source $PWD/khiops_data --connection-string "${{ steps.azuright.outputs.connstring }}"

      # Setup the build machine with the most recent versions of CMake and Ninja. Both are cached if not already: on subsequent runs both will be quickly restored from GitHub cache service.
      - uses: lukka/get-cmake@v3.30.1

      # Restore vcpkg from the GitHub Action cache service. Note that packages are restored by vcpkg's binary caching
      # when it is being run afterwards by CMake.
      - name: Restore vcpkg
        uses: actions/cache@v4
        with:
          # The first path is the location of vcpkg: it contains the vcpkg executable and data files, as long as the
          # built package archives (aka binary cache) which are located by VCPKG_DEFAULT_BINARY_CACHE env var.
          # The other paths starting with '!' are exclusions: they contain termporary files generated during the build of the installed packages.
          path: |
            ${{ env._VCPKG_ }}
            !${{ env._VCPKG_ }}/buildtrees
            !${{ env._VCPKG_ }}/packages
            !${{ env._VCPKG_ }}/downloads
            !${{ env._VCPKG_ }}/installed
          # The key is composed in a way that it gets properly invalidated whenever a different version of vcpkg is being used.
          key: |
            ${{ hashFiles( '.git/modules/vcpkg/HEAD' )}}

      # On Windows runners, let's ensure to have the Developer Command Prompt environment setup correctly.
      # As used here the Developer Command Prompt created is targeting x64 and using the default the Windows SDK.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.0

      - name: Install coverage tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install lcov gcovr

      # Run CMake to generate Ninja project files, using the vcpkg's toolchain file to resolve and install
      # the dependencies as specified in vcpkg.json. Note that the vcpkg's toolchain is specified
      # in the CMakePresets.json file.
      # This step also runs vcpkg with Binary Caching leveraging GitHub Action cache to
      # store the built packages artifacts.
      - name: Restore from cache the dependencies and generate project files
        if: matrix.os == 'ubuntu-latest'
        run: cmake --preset ninja-dbg -DBUILD_TESTS=ON

      - name: Build debug
        if: matrix.os == 'ubuntu-latest'
        run: cmake --build --preset ninja-dbg

      - name: Run sanitizer checks (emulated blob storage)
        if: matrix.os == 'ubuntu-latest'
        run: ctest --preset ninja-dbg
        env:
          AZURE_EMULATED_STORAGE: 'true'
          AZURE_STORAGE_CONNECTION_STRING: '${{ steps.azuright.outputs.connstring }}'
          STORAGE_DRIVER_TEST_URL_PREFIX: '${{ env.STORAGE_DRIVER_TEST_URL_PREFIX_EMULATED_BLOB }}'

      - name: Run sanitizer checks (cloud blob storage)
        if: matrix.os == 'ubuntu-latest'
        run:  ctest --preset ninja-dbg
        env:
          AZURE_EMULATED_STORAGE: 'false'
          AZURE_STORAGE_CONNECTION_STRING: '${{ secrets.AZURE_CONNECTION_STRING }}'
          CTEST_PARALLEL_LEVEL: ''
          STORAGE_DRIVER_TEST_URL_PREFIX: '${{ env.STORAGE_DRIVER_TEST_URL_PREFIX_CLOUD_BLOB }}'

      - name: Run sanitizer checks (cloud file storage)
        if: matrix.os == 'ubuntu-latest'
        run:  ctest --preset ninja-dbg
        env:
          AZURE_EMULATED_STORAGE: 'false'
          AZURE_STORAGE_CONNECTION_STRING: '${{ secrets.AZURE_CONNECTION_STRING }}'
          CTEST_PARALLEL_LEVEL: ''
          STORAGE_DRIVER_TEST_URL_PREFIX: '${{ env.STORAGE_DRIVER_TEST_URL_PREFIX_CLOUD_FILE }}'

      # Disable coverage until we find how to fix the "line mismatch error"
      # cmake --build --preset ninja-vcpkg-debug --target khiops-gcs_coverage --target khiops-gcs_cobertura
      
      # - name: Upload coverage results
      #   uses: actions/upload-artifact@v7
      #   if: matrix.os == 'ubuntu-latest'
      #   with:
      #     name: coverage
      #     path: |
      #       builds/ninja-multi-vcpkg/coverage/*
      #       builds/ninja-multi-vcpkg/coverage.*
      #     if-no-files-found: ignore

      # Build (Release configuration only) the whole project with Ninja (which is spawn by CMake).
      #
      # Note: if the preset misses the "configuration", it is possible to explicitly select the
      # configuration with the `--config` flag, e.g.:
      # run: cmake --build --preset ninja-vcpkg --config Release
      - name: Restore from cache the dependencies and generate project files
        run: cmake --preset ninja-rel -DBUILD_TESTS=ON

      - name: Build release
        run: cmake --build --preset ninja-rel

      # Retrieve azure credentials through WIF - needed to run tests
      - name: Azure CLI Login
        if: github.ref_type != 'tag'
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - if: github.ref_type == 'tag'
        shell: bash
        run: echo "AZURE_STORAGE_CONNECTION_STRING='${{ secrets.AZURE_CONNECTION_STRING }}'" >> $GITHUB_ENV
      
      # Test the whole project with CTest, again Release configuration only.
      - name: Test release (cloud blob storage)
        run: ctest --preset ninja-rel --output-junit test_results_blob.xml
        env:
          CTEST_PARALLEL_LEVEL: ''
          STORAGE_DRIVER_TEST_URL_PREFIX: '${{ env.STORAGE_DRIVER_TEST_URL_PREFIX_CLOUD_BLOB }}'
          
      - name: Test release (cloud file storage)
        run: ctest --preset ninja-rel --output-junit test_results_file.xml
        env:
          CTEST_PARALLEL_LEVEL: ''
          STORAGE_DRIVER_TEST_URL_PREFIX: '${{ env.STORAGE_DRIVER_TEST_URL_PREFIX_CLOUD_FILE }}'

      - name: Upload results of cloud storage tests
        if: always()
        uses: test-summary/action@v2
        with:
          paths: |
            ${{ github.workspace }}/build/ninja-rel/test_results_blob.xml
            ${{ github.workspace }}/build/ninja-rel/test_results_file.xml

      - name: Upload the packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}
          path: |
            build/ninja-rel/lib/*.dylib
            build/ninja-rel/lib/*.so
            build/ninja-rel/bin/*.dll
          if-no-files-found: ignore
