# This workflow tests if the driver installation conflicts with other drivers' installations.

name: Test driver conflict
on: workflow_dispatch

defaults:
  run:
    shell: bash

jobs:
  test-driver-conflict:
    name: Test driver conflict on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: 3.9

      - name: Create a virtual environment
        run: python -m venv venv

      - name: Create an environment variable pointing at the directory containing the executables (Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: echo "ENVBIN=venv/bin" >> "$GITHUB_ENV"

      - name: Create an environment variable pointing at the directory containing the executables (Windows)
        if: runner.os == 'Windows'
        run: echo "ENVBIN=venv/Scripts" >> "$GITHUB_ENV"

      - name: Install Khiops Core
        run: $ENVBIN/pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple khiops-core

      - name: Install multiple drivers
        run: $ENVBIN/pip install -i https://test.pypi.org/simple/ khiops-driver-s3 khiops-driver-gcs khiops-driver-azure

      - name: Check that all drivers are detected by Khiops Core (Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          KHIOPS_OUTPUT="$($ENVBIN/khiops -s)"
          echo "$KHIOPS_OUTPUT" | grep 'S3 driver'
          echo "$KHIOPS_OUTPUT" | grep 'GCS driver'
          echo "$KHIOPS_OUTPUT" | grep 'Azure driver'

      - name: Add Intel MPI runtime to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $venvRoot = Resolve-Path "venv"
          Write-Host "venv root: $venvRoot"

          $impiDll = Get-ChildItem -Path $venvRoot -Recurse -Filter "impi.dll" -ErrorAction SilentlyContinue |
                    Select-Object -First 1

          if (-not $impiDll) {
            Write-Error "impi.dll not found in venv"
            exit 1
          }

          $impiDir = $impiDll.DirectoryName
          Write-Host "Found impi.dll in: $impiDir"

          "PATH=$impiDir;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        
      - name: Check that all drivers are detected by Khiops Core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmd = "$env:ENVBIN\khiops.cmd"
          $stdout = Join-Path $env:RUNNER_TEMP "khiops_stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "khiops_stderr.txt"

          $p = Start-Process -FilePath $cmd `
            -ArgumentList "-s" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -NoNewWindow `
            -PassThru

          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force
            Write-Error "Timeout: khiops -s did not finish within 60s"
            exit 1
          }

          $out = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
          $err = Get-Content $stderr -Raw -ErrorAction SilentlyContinue

          Write-Host "----- STDOUT -----"
          $out | Out-Host
          Write-Host "----- STDERR -----"
          $err | Out-Host
          Write-Host "ExitCode=$($p.ExitCode)"

          if ($out -notmatch 'S3 driver') {
            Write-Error "Pattern 'S3 driver' not found in stdout"
            exit 1
          }

          if ($out -notmatch 'GCS driver') {
            Write-Error "Pattern 'GCS driver' not found in stdout"
            exit 1
          }
          
          if ($out -notmatch 'Azure driver') {
            Write-Error "Pattern 'Azure driver' not found in stdout"
            exit 1
          }

      # Fetch test-khiops-on-iris action
      - uses: actions/checkout@v6
        with:
          sparse-checkout: ./.github/actions/test-khiops-on-iris
          sparse-checkout-cone-mode: false

      - name: Test Khiops+driver on Iris dataset
        uses: ./.github/actions/test-khiops-on-iris
        with:
          os-decription: ${{ matrix.os }}